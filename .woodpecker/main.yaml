when:
  - event: push
    branch: "**"

steps:
  - name: build
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    environment:
      GRADLE_OPTS: >-
        -Djavax.net.ssl.trustAllCerts=true
    commands:
      - ./gradlew clean
      - ./gradlew build --scan --info --stacktrace -Dhttps.cipherSuites=""
  - name: format
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew spotlessCheck
  - name: lint
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew pmdMain -Pci