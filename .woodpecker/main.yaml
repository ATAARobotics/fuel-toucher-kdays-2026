when:
  - event: push
    branch: "**"

steps:
  - name: sync-time
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      # Install and force sync
      - apt-get update && apt-get install -y ntpdate ca-certificates
      - ntpdate -s pool.ntp.org
      
      # Also enable continuous sync for longer builds
      - timedatectl set-ntp true
      - date -u  # Log time for debugging

  - name: build
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew build --scan --info --stacktrace
  - name: format
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew spotlessCheck
  - name: lint
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew pmdMain -Pci