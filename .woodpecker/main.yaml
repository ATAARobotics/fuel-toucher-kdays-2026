when:
  - event: push
    branch: "**"

steps:
  - name: build
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    environment:
      GRADLE_OPTS: -Djavax.net.ssl.trustStore=$JAVA_HOME/lib/security/cacerts -Djavax.net.ssl.trustStorePassword=changeit -Djdk.tls.disabledAlgorithms=""
    commands:
      - ./gradlew clean
      - ./gradlew build --scan --info --stacktrace
  - name: format
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew spotlessCheck
  - name: lint
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew pmdMain -Pci