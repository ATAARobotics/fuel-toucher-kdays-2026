when:
  - event: push
    branch: "**"

steps:
  - name: sync-time
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - apt-get update && apt-get install -y systemd
      - timedatectl set-ntp true
      - systemctl restart systemd-timesyncd
      - sleep 10  # Wait for sync
      - timedatectl  # Show status

  - name: build
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew build --scan --info --stacktrace
  - name: format
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew spotlessCheck
  - name: lint
    image: wpilib/roborio-cross-ubuntu:2025-24.04
    commands:
      - ./gradlew pmdMain -Pci